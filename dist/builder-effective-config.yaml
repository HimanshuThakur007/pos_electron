directories:
  output: dist
  buildResources: build
appId: com.yourcompany.desktoppos
productName: Desktop POS
asar: true
files:
  - filter:
      - electron/**/*
      - renderer/pos-ui/dist/**/*
      - package.json
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 40.2.1
